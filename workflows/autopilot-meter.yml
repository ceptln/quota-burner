# Optional Claude meter only. Install after reading docs/SETUP.md.
name: autopilot-meter

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: autopilot-meter-claude
  cancel-in-progress: false

jobs:
  snapshot:
    if: vars.QUOTA_BURNER_CLAUDE_METER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Take and publish snapshot
        env:
          CLAUDE_AUTOPILOT_TOKEN: ${{ secrets.CLAUDE_AUTOPILOT_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash .quota-burner/scripts/claude-meter.sh |
            python3 .quota-burner/scripts/publish-meter.py --repo "$GITHUB_REPOSITORY" --author 'github-actions[bot]'
